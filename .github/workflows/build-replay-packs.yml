name: Build replay room packs

# 리플레이 방에서 쓰는 종목별 1년치 일봉 묶음. 매주 토요일 10:00 KST + 스크립트 수정 시.
on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/build-replay-packs.mjs'
      - '.github/workflows/build-replay-packs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build packs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/build-replay-packs.mjs

      - name: Commit and push
        run: |
          git add public/data/replay
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update replay packs ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
