name: Fetch DART facts

on:
  schedule:
    # 07:00 KST daily (22:00 UTC previous day)
    - cron: '0 22 * * *'
    # 06:00 KST 매주 월요일 (일요일 21:00 UTC) - 주간 리캡 wake-up 푸시
    - cron: '0 21 * * 0'
  workflow_dispatch: {}

jobs:
  fetch:
    if: github.event.schedule != '0 21 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch today's disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/fetch-facts.mjs

      - name: Fetch KR closing prices
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-prices.mjs

      - name: Check for changes
        id: diff
        run: |
          git add public/data/today.json
          git add public/data/prices.json 2>/dev/null || true
          git diff --staged --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update today.json ($(date -u +%Y-%m-%d))"
          git push

      # 새 소식이 있을 때만 wake-up 푸시 발송 (§2-3) - 변화 없으면 조용히 넘어간다.
      - name: Notify subscribers
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mjs

  weekly-recap:
    if: github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 서버는 개인별 워치리스트를 모른다(§2-3) - 그냥 깨우기만 하고, 실제 요약
      # 내용은 앱이 로컬 데이터(disclosures/streak)로 계산해서 보여준다.
      - name: Send weekly recap wake-up push
        env:
          PUSH_TYPE: weekly-recap
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mjs
