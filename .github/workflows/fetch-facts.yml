name: Fetch DART facts

on:
  schedule:
    # 07:00 KST daily (22:00 UTC previous day)
    - cron: '0 22 * * *'
    # 06:00 KST 매주 월요일 (일요일 21:00 UTC) - 주간 리캡 wake-up 푸시
    - cron: '0 21 * * 0'
  workflow_dispatch: {}

jobs:
  fetch:
    if: github.event.schedule != '0 21 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Supabase 무료 티어는 7일간 DB 요청이 없으면 프로젝트를 정지한다. 푸시는
      # 새 공시가 있을 때만 나가므로(아래 Notify subscribers) 조용한 주가 이어지면
      # DB가 그대로 잠든다. 이 select 한 번이 매일 무활동 타이머를 리셋한다.
      - name: Keep Supabase project awake
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sfS "$SUPABASE_URL/rest/v1/push_subscriptions?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" > /dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch today's disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/fetch-facts.mjs

      # 실패해도 공시 수집/커밋은 계속 가야 하지만, 조용히 넘어가면 상단 지수 티커가
      # 왜 빈지 알 수 없다. continue-on-error(초록 체크로 숨김) 대신 ::warning:: 으로
      # 실행 요약에 노란 경고를 남긴다.
      - name: Fetch KR closing prices
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node scripts/fetch-prices.mjs || echo "::warning title=KR 시세 수집 실패 (exit $?)::fetch-prices.mjs 실패 - prices.json/indices.json/money-flow.json이 갱신되지 않아 상단 지수 티커와 관심종목 시세가 빈 채로 남는다. DATA_GO_KR_KEY 시크릿 등록 여부와 data.go.kr 서비스 신청 상태(주식시세정보 + 지수시세정보)를 확인할 것."

      - name: Check for changes
        id: diff
        run: |
          git add public/data/today.json
          git add public/data/prices.json 2>/dev/null || true
          git add public/data/money-flow.json 2>/dev/null || true
          git add public/data/indices.json 2>/dev/null || true
          git diff --staged --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update today.json ($(date -u +%Y-%m-%d))"
          git push

      # 새 소식이 있을 때만 wake-up 푸시 발송 (§2-3) - 변화 없으면 조용히 넘어간다.
      - name: Notify subscribers
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mjs

  weekly-recap:
    if: github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 서버는 개인별 워치리스트를 모른다(§2-3) - 그냥 깨우기만 하고, 실제 요약
      # 내용은 앱이 로컬 데이터(disclosures/streak)로 계산해서 보여준다.
      - name: Send weekly recap wake-up push
        env:
          PUSH_TYPE: weekly-recap
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mjs
